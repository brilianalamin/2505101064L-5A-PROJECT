
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Semantic</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f2f2f2;
        }

        header {
            background-color: #3498db;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background-color: #34495e;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        section {
            background-color: white;
            padding: 20px;
            min-height: 200px;
        }

        article {
            background-color: #d5f5e3;
            padding: 20px;
            border-left: 5px solid #27ae60;
        }

        footer {
            background-color: #34495e;
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>Website Semantic</h1>
        <p>Contoh Struktur HTML Semantic</p>
    </header>

    <nav>
        <a href="#">Beranda</a>
        <a href="#">Artikel</a>
        <a href="#">Tentang</a>
    </nav>

    <section>
        <h2>Content Website</h2>

        <article>
            <h3>Artikel Pertama</h3>
            <p>
                Ini adalah contoh artikel menggunakan elemen
                HTML Semantic yaitu article.
            </p>
        </article>
    </section>

    <footer>
        <p>Copyright 2026 - Website Semantic</p>
    </footer>

</body>
</html>
