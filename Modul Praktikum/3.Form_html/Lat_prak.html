<!DOCTYPE html>
<html>
<head>
<title>Belajar Membuat Form </title>
</head>
<body>
<form action=" formulir.html" method="get">
Nama: <inputype="text"name="nama" value="Nama Kamu" />
<br/>
Password: <inputtype="password"name="password" />
<br />
Jenis Kelamin :
 <input type="radio"name="jeniskelamin" value="laki-laki" checked />
 Laki - Laki
 <inputtype="radio"name="jeniskelamin"value="perempuan" />
 Perempuan
 <br />
Hobi: <input type="checkbox"name="hobibaca" /> Membaca Buku
<input type="checkbox"name="hobinulis" checked /> Menulis
<input type="checkbox"name="hobimancing" /> Memancing
 <br />
 Asal Kota:
<select name="asalkota">
<option value="Kota Jakarta"> Jakarta</option>
<option>Bandung</option>
<option value="Kota Semarang" selected>Semarang</option>
</select>
<br/>
 Komentar Anda:
 <textarea name="komentar"rows="5"cols="20">
 Silahkan katakan isi hati anda
 </textarea>
 <br />
 <input type="submit" value="Mulai Proses!">
 </form>
 </body>
 </html>
