
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Perpustakaan Madiun</title>
</head>

<body>

    <h1>FORMULIR PENDAFTARAN PERPUSTAKAAN</h1>
    <h2>Perpustakaan Kota Madiun</h2>

    <hr>

    <form action="#" method="get">

        <!-- Data Pribadi -->
        <h3>Data Pribadi</h3>

        <label for="nama">Nama Lengkap:</label><br>
        <input type="text" id="nama" name="nama"
               placeholder="Masukkan nama lengkap" required>
        <br><br>

        <label for="tanggal_lahir">Tanggal Lahir:</label><br>
        <input type="date" id="tanggal_lahir"
               name="tanggal_lahir" required>
        <br><br>

        <label>Jenis Kelamin:</label><br>
        <input type="radio" id="laki" name="jenis_kelamin"
               value="Laki-laki" required>
        <label for="laki">Laki-laki</label>

        <input type="radio" id="perempuan" name="jenis_kelamin"
               value="Perempuan">
        <label for="perempuan">Perempuan</label>
        <br><br>

        <label for="alamat">Alamat:</label><br>
        <textarea id="alamat" name="alamat"
                  rows="4" cols="40"
                  placeholder="Masukkan alamat lengkap"
                  required></textarea>
        <br><br>

        <label for="telepon">Nomor Telepon:</label><br>
        <input type="tel" id="telepon" name="telepon"
               placeholder="Contoh: 081234567890" required>
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"
               placeholder="nama@email.com" required>
        <br><br>

        <!-- Data Keanggotaan -->
        <h3>Data Keanggotaan</h3>

        <label for="kategori">Kategori Anggota:</label><br>
        <select id="kategori" name="kategori" required>
            <option value="">-- Pilih Kategori --</option>
            <option value="Pelajar">Pelajar</option>
            <option value="Mahasiswa">Mahasiswa</option>
            <option value="Umum">Umum</option>
            <option value="Pegawai">Pegawai</option>
        </select>
        <br><br>

        <label for="pendidikan">Pendidikan Terakhir:</label><br>
        <select id="pendidikan" name="pendidikan" required>
            <option value="">-- Pilih Pendidikan --</option>
            <option value="SD">SD</option>
            <option value="SMP">SMP</option>
            <option value="SMA">SMA/SMK</option>
            <option value="Diploma">Diploma</option>
            <option value="Sarjana">Sarjana</option>
            <option value="Lainnya">Lainnya</option>
        </select>
        <br><br>

        <!-- Minat Bacaan -->
        <h3>Minat Bacaan</h3>

        <input type="checkbox" id="fiksi" name="minat[]"
               value="Fiksi">
        <label for="fiksi">Buku Fiksi</label>
        <br>

        <input type="checkbox" id="pendidikan" name="minat[]"
               value="Pendidikan">
        <label for="pendidikan">Buku Pendidikan</label>
        <br>

        <input type="checkbox" id="teknologi" name="minat[]"
               value="Teknologi">
        <label for="teknologi">Buku Teknologi</label>
        <br>

        <input type="checkbox" id="sejarah" name="minat[]"
               value="Sejarah">
        <label for="sejarah">Buku Sejarah</label>
        <br><br>

        <!-- Alasan Mendaftar -->
        <label for="alasan">Alasan Mendaftar:</label><br>
        <textarea id="alasan" name="alasan"
                  rows="4" cols="40"
                  placeholder="Tuliskan alasan Anda mendaftar"></textarea>
        <br><br>

        <!-- Persetujuan -->
        <input type="checkbox" id="persetujuan"
               name="persetujuan" value="Setuju" required>
        <label for="persetujuan">
            Saya menyatakan bahwa data yang diisi benar.
        </label>
        <br><br>

        <!-- Tombol Formulir -->
        <input type="submit" value="Daftar">
        <input type="reset" value="Hapus Formulir">

    </form>

    <hr>

    <footer>
        <p>&copy; 2026 Perpustakaan Kota Madiun</p>
    </footer>

</body>

</html>
