
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Membuat Form</title>
</head>
<body>

    <h1>Formulir HTML</h1>

    <form action="formulir.html" method="get">

        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" value="Nama Kamu">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <p>Jenis Kelamin:</p>
        <input type="radio" id="laki-laki" name="jenis_kelamin" value="laki-laki" checked>
        <label for="laki-laki">Laki-laki</label>

        <input type="radio" id="perempuan" name="jenis_kelamin" value="perempuan">
        <label for="perempuan">Perempuan</label>
        <br><br>

        <p>Hobi:</p>
        <input type="checkbox" id="hobi_baca" name="hobi_baca" value="Membaca">
        <label for="hobi_baca">Membaca Buku</label>
        <br>

        <input type="checkbox" id="hobi_menulis" name="hobi_menulis" value="Menulis" checked>
        <label for="hobi_menulis">Menulis</label>
        <br>

        <input type="checkbox" id="hobi_mancing" name="hobi_mancing" value="Memancing">
        <label for="hobi_mancing">Memancing</label>
        <br><br>

        <label for="asal_kota">Asal Kota:</label>
        <select id="asal_kota" name="asal_kota">
            <option value="Kota Jakarta">Jakarta</option>
            <option value="Bandung">Bandung</option>
            <option value="Kota Semarang" selected>Semarang</option>
        </select>
        <br><br>

        <label for="komentar">Komentar Anda:</label>
        <br>
        <textarea id="komentar" name="komentar" rows="5" cols="30">Silahkan katakan isi hati anda</textarea>
        <br><br>

        <input type="submit" value="Mulai Proses!">

    </form>

</body>
</html>
