
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum HTML Dasar</title>
</head>
<body>

    <h1>Praktikum HTML Dasar</h1>

    <!-- 1. Struktur HTML -->

    <!-- 2. Tag Italic -->
    <h2>2. Italic</h2>
    <p>Ini adalah contoh tulisan <i>miring</i>.</p>

    <!-- 3. Tag Image -->
    <h2>3. Image</h2>
    <img src="gambar.jpg" alt="Contoh gambar" width="200">

    <!-- 4. Tag Break -->
    <h2>4. Break</h2>
    <p>
        Nama: Andi<br>
        Kelas: Informatika<br>
        Mata Kuliah: Web Dasar
    </p>

    <!-- 5. Tag Link -->
    <h2>5. Link</h2>
    <a href="https://www.google.com" target="_blank">
        Kunjungi Google
    </a>

    <!-- 6. Tabel 4 Kolom 2 Baris -->
    <h2>6. Tabel 4 Kolom 2 Baris</h2>
    <table border="1" cellpadding="10">
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Kelas</th>
            <th>Jurusan</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Andi</td>
            <td>A</td>
            <td>Informatika</td>
        </tr>
    </table>

    <!-- 7. List Romawi Dimulai dari Urutan 10 -->
    <h2>7. List Romawi</h2>
    <ol type="I" start="10">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>PHP</li>
    </ol>

</body>
</html>
