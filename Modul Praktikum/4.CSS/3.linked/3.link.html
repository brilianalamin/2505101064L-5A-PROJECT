
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linked Styles</title>

    <style>
        /* Mengatur tampilan paragraf */
        p {
            background: #FFD9D9;
            border-bottom: 4px solid red;
            padding-top: 15px;
            margin: 10px;
            width: auto;
            height: 35px;
            text-align: center;
            display: block;
        }

        /* Pesan informasi */
        #msg {
            color: #0000FF;
            font-weight: bold;
            font-size: 12px;
        }

        /* Pesan kesalahan */
        #error {
            color: #FF1111;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <h1>Ini bagian header</h1>

    <p>Ini adalah paragraph</p>

    <p id="msg">Ini adalah pesan informasi</p>

    <p id="error">Ini adalah pesan kesalahan</p>

</body>
</html>
